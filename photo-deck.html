  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

<body data-theme="light" data-size="medium">
  <header class="subnav"><a href="index.html">← 回到首頁</a><strong>PHOTO THEMES<small>照片主題簡報集</small></strong><a href="gallery.html">照片庫 ↗</a></header>
  <section class="controls" aria-label="顯示設定"><div><b>文字</b><button data-size="medium" aria-pressed="true">中</button><button data-size="large" aria-pressed="false">大</button><button data-size="xlarge" aria-pressed="false">特大</button></div><div><b>背景</b><button class="theme light" data-theme="light" aria-label="淺色背景"></button><button class="theme dark" data-theme="dark" aria-label="深色背景"></button><button class="theme green" data-theme="green" aria-label="綠色背景"></button><button class="theme blue" data-theme="blue" aria-label="藍色背景"></button></div></section>

      <div class="deck-content" data-deck-content></div>
    </section>
  </main>
  <footer class="footer"><span>董勳遠｜照片主題簡報集</span><a href="index.html">回到教育故事 ↑</a></footer>
